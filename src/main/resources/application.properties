# ---------------------------------------------------------------------------
# Database configuration (MySQL 8).
# Any of these can be overridden with environment variables:
#   DB_DRIVER, DB_URL, DB_USER, DB_PASSWORD, DB_DIALECT, DB_DDL
# ---------------------------------------------------------------------------
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/placementhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=

# ---------------------------------------------------------------------------
# Hibernate
# ---------------------------------------------------------------------------
hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 'update' keeps the schema in sync on startup. Use 'validate' against schema.sql in prod.
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
